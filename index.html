<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violeta — Acrónimo Interactivo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Alex Brush, Great Vibes y Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-void: #07050a;
            --crimson: #dc143c;
            --crimson-glow: rgba(220, 20, 60, 0.75);
            --violet: #9d4edd;
            --violet-glow: rgba(157, 78, 221, 0.85);
            --rose-light: #f8e8ee;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-void);
            font-family: 'Cormorant Garamond', serif;
            color: var(--rose-light);
        }

        /* Fondo atmosférico con viñeta gótica carmesí y violeta profundo */
        .ambient-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 42%, rgba(88, 28, 135, 0.2) 0%, rgba(136, 19, 55, 0.12) 38%, rgba(7, 5, 10, 0.98) 82%),
                radial-gradient(circle at 18% 82%, rgba(220, 20, 60, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 82% 18%, rgba(157, 78, 221, 0.1) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Textura sutil de grano */
        .noise-overlay {
            position: fixed;
            inset: 0;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 1;
            pointer-events: none;
        }

        /* Canvas de partículas a pantalla completa */
        #particleCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: block;
        }

        /* Escenario principal centrado */
        .stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            padding: 1.25rem;
        }

        /* Contenedor de las letras interactivas */
        .title-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            padding: 0.5rem 1rem;
        }

        /* Tipografía caligráfica elegante */
        .violeta-text {
            font-family: 'Great Vibes', 'Alex Brush', cursive;
            font-weight: 400;
            font-size: clamp(4.6rem, 16vw, 11.5rem);
            letter-spacing: 0.03em;
            line-height: 1.08;
            margin: 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: baseline;
            color: #f8e8ee;
            text-shadow: 0 0 22px rgba(220, 20, 60, 0.45), 0 0 42px rgba(157, 78, 221, 0.35);
        }

        /* Cada letra individual e interactiva */
        .char {
            display: inline-block;
            cursor: pointer;
            padding: 0 0.03em;
            position: relative;
            opacity: 0;
            transform: translateY(20px) scale(0.88);
            filter: blur(8px);
            animation: inkReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: calc(var(--i) * 0.14s);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), 
                        color 0.35s ease, 
                        text-shadow 0.35s ease;
        }

        /* Elevación y brillo sutil al pasar el cursor */
        .char:hover {
            transform: translateY(-8px) scale(1.08) !important;
            color: #ffffff;
            text-shadow: 
                0 0 18px rgba(255, 255, 255, 0.85),
                0 0 32px var(--crimson-glow),
                0 0 55px var(--violet-glow);
        }

        /* Estado de la letra seleccionada/activa */
        .char.active {
            transform: translateY(-10px) scale(1.12) !important;
            color: #fff5f8;
            text-shadow: 
                0 0 16px #ffffff,
                0 0 30px var(--crimson),
                0 0 55px var(--violet),
                0 0 80px rgba(220, 20, 60, 0.8);
        }

        /* Punto luminoso sutil bajo la letra activa */
        .char::after {
            content: '';
            position: absolute;
            bottom: 0.08em;
            left: 50%;
            width: 6px;
            height: 6px;
            border-radius: 9999px;
            background: radial-gradient(circle, #fff 15%, var(--crimson) 65%, transparent 100%);
            box-shadow: 0 0 12px var(--crimson), 0 0 20px var(--violet);
            transform: translateX(-50%) scale(0);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
        }

        .char.active::after {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        /* Línea caligráfica luminosa bajo el nombre */
        .calligraphy-flourish {
            width: 0%;
            height: 2px;
            margin-top: 0.35rem;
            background: linear-gradient(90deg, transparent, var(--crimson), var(--violet), var(--crimson), transparent);
            box-shadow: 0 0 14px var(--crimson);
            opacity: 0;
            animation: flourishExpand 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
        }

        @keyframes inkReveal {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.88);
                filter: blur(8px);
                color: var(--crimson);
            }
            60% {
                color: #e0aaff;
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
                color: #fff0f5;
            }
        }

        @keyframes flourishExpand {
            to {
                width: min(78vw, 500px);
                opacity: 0.9;
            }
        }

        /* =========================================
           TARJETA CRISTAL OSCURO / GÓTICO (ACRÓNIMO)
           ========================================= */
        .acronym-slot {
            margin-top: 1.5rem;
            min-height: 175px;
            width: 100%;
            max-width: 640px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .acronym-card {
            width: 100%;
            background: linear-gradient(145deg, rgba(22, 12, 32, 0.72) 0%, rgba(12, 7, 18, 0.86) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(220, 20, 60, 0.35);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                inset 0 0 26px rgba(157, 78, 221, 0.14),
                0 0 28px rgba(220, 20, 60, 0.16);
            border-radius: 1.35rem;
            padding: 1.25rem 1.45rem;
            display: flex;
            align-items: center;
            opacity: 0;
            transform: translateY(14px) scale(0.96);
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1), 
                        transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.4s ease;
        }

        .acronym-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Animación de actualización fluida al cambiar de letra */
        .acronym-card.switching .card-content {
            opacity: 0;
            transform: translateY(6px);
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            width: 100%;
            transition: opacity 0.24s ease, transform 0.24s ease;
        }

        /* Marco fotográfico interactivo para cada letra */
        .photo-frame {
            position: relative;
            flex-shrink: 0;
            width: 132px;
            height: 132px;
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            background: radial-gradient(circle at 30% 30%, rgba(220, 20, 60, 0.22), rgba(28, 14, 42, 0.85));
            border: 1px solid rgba(220, 20, 60, 0.45);
            box-shadow: 
                0 0 20px rgba(220, 20, 60, 0.22),
                inset 0 0 16px rgba(157, 78, 221, 0.28);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.35s ease,
                        box-shadow 0.35s ease;
        }

        .photo-frame:hover {
            transform: scale(1.03);
            border-color: rgba(248, 232, 238, 0.65);
            box-shadow: 
                0 0 25px rgba(220, 20, 60, 0.45),
                0 0 35px rgba(157, 78, 221, 0.35);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .photo-frame:hover img {
            transform: scale(1.06);
        }

        .photo-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.6rem;
            gap: 0.4rem;
            color: rgba(248, 232, 238, 0.82);
        }

        .photo-placeholder svg {
            width: 26px;
            height: 26px;
            stroke: #f8e8ee;
            filter: drop-shadow(0 0 8px rgba(220, 20, 60, 0.7));
            opacity: 0.9;
        }

        .photo-placeholder span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.86rem;
            font-style: italic;
            letter-spacing: 0.03em;
            line-height: 1.2;
        }

        /* Botón sutil superpuesto cuando ya existe una foto */
        .photo-change-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(7, 5, 10, 0.82) 0%, rgba(7, 5, 10, 0.25) 55%, transparent 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 0.55rem;
            opacity: 0;
            transition: opacity 0.28s ease;
        }

        .photo-frame.has-image:hover .photo-change-overlay,
        .photo-frame.has-image:focus-visible .photo-change-overlay {
            opacity: 1;
        }

        .photo-change-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.22rem 0.6rem;
            border-radius: 9999px;
            background: rgba(22, 12, 32, 0.85);
            border: 1px solid rgba(220, 20, 60, 0.55);
            color: #fff0f5;
            font-size: 0.78rem;
            font-style: italic;
            box-shadow: 0 0 12px rgba(220, 20, 60, 0.4);
        }

        /* Bloque derecho: letra caligráfica + frase */
        .card-text-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 0;
        }

        .card-letter-badge {
            flex-shrink: 0;
            width: 3.35rem;
            height: 3.35rem;
            border-radius: 0.95rem;
            background: radial-gradient(circle at 30% 30%, rgba(220, 20, 60, 0.28), rgba(88, 28, 135, 0.32));
            border: 1px solid rgba(248, 232, 238, 0.22);
            box-shadow: 0 0 20px rgba(220, 20, 60, 0.3), inset 0 0 12px rgba(157, 78, 221, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Great Vibes', 'Alex Brush', cursive;
            font-size: 2.5rem;
            color: #fff0f5;
            text-shadow: 0 0 14px var(--crimson), 0 0 26px var(--violet);
            padding-top: 0.15rem;
        }

        .card-phrase {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.1rem, 2.8vw, 1.35rem);
            line-height: 1.45;
            color: #f8e8ee;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
            letter-spacing: 0.01em;
        }

        @media (max-width: 560px) {
            .acronym-slot {
                margin-top: 1.15rem;
                min-height: 230px;
            }
            .acronym-card {
                padding: 1rem 1.1rem;
            }
            .card-content {
                flex-direction: column;
                gap: 0.85rem;
                text-align: center;
            }
            .photo-frame {
                width: 112px;
                height: 112px;
            }
            .card-text-group {
                flex-direction: row;
                text-align: left;
                width: 100%;
                gap: 0.85rem;
            }
            .card-letter-badge {
                width: 2.85rem;
                height: 2.85rem;
                font-size: 2.15rem;
            }
            /* En pantallas táctiles mostrar una pista muy sutil para cambiar foto */
            .photo-frame.has-image .photo-change-overlay {
                opacity: 0.85;
                background: linear-gradient(to top, rgba(7, 5, 10, 0.78) 0%, transparent 55%);
            }
        }
    </style>
</head>
<body>
    <!-- Fondo atmosférico y textura -->
    <div class="ambient-bg"></div>
    <div class="noise-overlay"></div>

    <!-- Canvas de partículas a pantalla completa -->
    <canvas id="particleCanvas"></canvas>

    <!-- Escenario principal -->
    <main class="stage">
        <div class="title-wrapper">
            <h1 class="violeta-text" aria-label="Violeta">
                <span class="char" style="--i:0" role="button" tabindex="0">V</span>
                <span class="char" style="--i:1" role="button" tabindex="0">i</span>
                <span class="char" style="--i:2" role="button" tabindex="0">o</span>
                <span class="char" style="--i:3" role="button" tabindex="0">l</span>
                <span class="char" style="--i:4" role="button" tabindex="0">e</span>
                <span class="char" style="--i:5" role="button" tabindex="0">t</span>
                <span class="char" style="--i:6" role="button" tabindex="0">a</span>
            </h1>
        </div>
        <div class="calligraphy-flourish"></div>

        <!-- Tarjeta de cristal oscuro/gótico para el acrónimo e imagen -->
        <section class="acronym-slot" aria-live="polite">
            <div class="acronym-card" id="acronymCard">
                <div class="card-content">
                    <!-- Marco fotográfico interactivo por letra -->
                    <div class="photo-frame" id="photoFrame" role="button" tabindex="0" title="Elegir o cambiar foto para esta letra">
                        <img id="cardImage" alt="Recuerdo de Violeta" style="display: none;">
                        <div class="photo-placeholder" id="photoPlaceholder">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            <span>Elegir foto</span>
                        </div>
                        <div class="photo-change-overlay">
                            <span class="photo-change-badge">Cambiar foto</span>
                        </div>
                    </div>

                    <!-- Letra caligráfica y frase poética -->
                    <div class="card-text-group">
                        <div class="card-letter-badge" id="cardLetter">V</div>
                        <p class="card-phrase" id="cardPhrase"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Selector de archivo oculto para cargar imágenes locales -->
        <input type="file" id="photoInput" accept="image/*" style="display: none;">
    </main>

    <script>
        (function () {
            'use strict';

            const STORAGE_KEY = 'violeta_acronym_photos_v2';

            // Diccionario poético del acrónimo V-I-O-L-E-T-A con tus 7 imágenes locales en orden
            const acronymData = [
                {
                    letter: 'V',
                    phrase: 'Valiente y vibrante, iluminas cada sombra con tu sola presencia.',
                    image: 'vio.jpg'
                },
                {
                    letter: 'i',
                    phrase: 'Inolvidable, de esas almas que dejan huella en cada mirada.',
                    image: 'vio2.png'
                },
                {
                    letter: 'o',
                    phrase: 'Orgullo y obra de arte, única en cada detalle de tu ser.',
                    image: 'vio3.jpg'
                },
                {
                    letter: 'l',
                    phrase: 'Luz en la oscuridad, el refugio donde todo vuelve a tener sentido.',
                    image: 'vio4.jpg'
                },
                {
                    letter: 'e',
                    phrase: 'Encanto eterno, capaz de detener el tiempo con una sonrisa.',
                    image: 'vio5.webp'
                },
                {
                    letter: 't',
                    phrase: 'Ternura y temple, la combinación perfecta que roba el aliento.',
                    image: 'vio6.avif'
                },
                {
                    letter: 'a',
                    phrase: 'Arte hecho persona, mi razón favorita para creer en la magia.',
                    image: 'vio7.jpeg'
                }
            ];

            // Cargar fotos personalizadas guardadas previamente en localStorage (si el usuario cambió alguna)
            function loadSavedPhotos() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const saved = JSON.parse(raw);
                    if (Array.isArray(saved)) {
                        saved.forEach((dataUrl, idx) => {
                            if (dataUrl && acronymData[idx]) {
                                acronymData[idx].image = dataUrl;
                            }
                        });
                    }
                } catch (e) {
                    console.warn('No se pudieron cargar las fotos guardadas:', e);
                }
            }

            // Guardar fotos personalizadas en localStorage
            function savePhotos() {
                try {
                    const list = acronymData.map(item =>
                        item.image && item.image.startsWith('data:') ? item.image : ''
                    );
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
                } catch (e) {
                    console.warn('Espacio insuficiente en almacenamiento local:', e);
                }
            }

            loadSavedPhotos();

            // Referencias del DOM
            const chars = Array.from(document.querySelectorAll('.char'));
            const acronymCard = document.getElementById('acronymCard');
            const cardLetter = document.getElementById('cardLetter');
            const cardPhrase = document.getElementById('cardPhrase');
            const photoFrame = document.getElementById('photoFrame');
            const cardImage = document.getElementById('cardImage');
            const photoPlaceholder = document.getElementById('photoPlaceholder');
            const photoInput = document.getElementById('photoInput');

            let activeIndex = -1;
            let switchTimeout = null;

            // Renderizar imagen o respaldo elegante en el marco
            function renderCardImage(src) {
                if (!src) {
                    cardImage.style.display = 'none';
                    cardImage.removeAttribute('src');
                    photoPlaceholder.style.display = 'flex';
                    photoFrame.classList.remove('has-image');
                    return;
                }

                cardImage.onerror = function () {
                    cardImage.style.display = 'none';
                    photoPlaceholder.style.display = 'flex';
                    photoFrame.classList.remove('has-image');
                };

                cardImage.onload = function () {
                    cardImage.style.display = 'block';
                    photoPlaceholder.style.display = 'none';
                    photoFrame.classList.add('has-image');
                };

                cardImage.src = src;
            }

            // Activar letra y mostrar tarjeta con transición fluida
            function selectLetter(index) {
                const item = acronymData[index];
                if (!item) return;

                // Actualizar estado activo de las letras
                chars.forEach((el, idx) => {
                    if (idx === index) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });

                // Liberar destello de partículas desde la letra seleccionada
                const rect = chars[index].getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                spawnBurst(cx, cy, 32);

                const isFirstOpen = !acronymCard.classList.contains('visible');
                activeIndex = index;

                if (isFirstOpen) {
                    cardLetter.textContent = item.letter;
                    cardPhrase.textContent = item.phrase;
                    renderCardImage(item.image);
                    acronymCard.classList.add('visible');
                } else {
                    clearTimeout(switchTimeout);
                    acronymCard.classList.add('switching');
                    switchTimeout = setTimeout(() => {
                        cardLetter.textContent = item.letter;
                        cardPhrase.textContent = item.phrase;
                        renderCardImage(item.image);
                        acronymCard.classList.remove('switching');
                    }, 180);
                }
            }

            // Eventos de clic y teclado en cada letra de Violeta
            chars.forEach((charEl, index) => {
                charEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectLetter(index);
                });

                charEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectLetter(index);
                    }
                });
            });

            // Permitir elegir o cambiar la foto de la letra activa
            photoFrame.addEventListener('click', (e) => {
                e.stopPropagation();
                if (activeIndex < 0) return;
                photoInput.value = '';
                photoInput.click();
            });

            photoFrame.addEventListener('keydown', (e) => {
                if ((e.key === 'Enter' || e.key === ' ') && activeIndex >= 0) {
                    e.preventDefault();
                    photoInput.value = '';
                    photoInput.click();
                }
            });

            photoInput.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file || activeIndex < 0) return;

                const reader = new FileReader();
                reader.onload = function (ev) {
                    const dataUrl = ev.target.result;
                    acronymData[activeIndex].image = dataUrl;
                    renderCardImage(dataUrl);
                    savePhotos();
                };
                reader.readAsDataURL(file);
            });

            // =========================================
            // SISTEMA DE PARTÍCULAS Y BRASAS LUMINOSAS
            // =========================================
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let width = 0;
            let height = 0;
            const particles = [];

            const palette = [
                'rgba(220, 20, 60, ',   // Carmesí
                'rgba(157, 78, 221, ',  // Violeta
                'rgba(248, 232, 238, ', // Destello rosa pálido
                'rgba(199, 125, 255, '  // Lavanda neón
            ];

            function resizeCanvas() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            class Ember {
                constructor(x, y, burst = false) {
                    this.x = x !== undefined ? x : Math.random() * width;
                    this.y = y !== undefined ? y : Math.random() * height;
                    this.burst = burst;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = burst ? (Math.random() * 4.2 + 1.2) : (Math.random() * 0.45 + 0.12);
                    this.vx = burst ? Math.cos(angle) * speed : (Math.random() - 0.5) * 0.4;
                    this.vy = burst ? Math.sin(angle) * speed - 0.8 : -speed;
                    this.size = burst ? (Math.random() * 2.8 + 1.2) : (Math.random() * 2.2 + 0.8);
                    this.life = 1;
                    this.decay = burst ? (Math.random() * 0.024 + 0.015) : (Math.random() * 0.004 + 0.002);
                    this.color = palette[Math.floor(Math.random() * palette.length)];
                    this.twinkle = Math.random() * Math.PI * 2;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.twinkle += 0.06;

                    if (this.burst) {
                        this.vx *= 0.96;
                        this.vy *= 0.96;
                        this.life -= this.decay;
                    } else {
                        this.x += Math.sin(this.twinkle) * 0.22;
                        this.life -= this.decay;
                        if (this.y < -10 || this.life <= 0) {
                            this.x = Math.random() * width;
                            this.y = height + 10;
                            this.life = 1;
                        }
                    }
                }

                draw() {
                    const alpha = Math.max(0, this.life * (0.65 + 0.35 * Math.sin(this.twinkle)));
                    ctx.save();
                    ctx.beginPath();
                    ctx.fillStyle = this.color + alpha.toFixed(3) + ')';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color + '0.85)';
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function initParticles() {
                particles.length = 0;
                const ambientCount = Math.min(75, Math.floor((width * height) / 14000));
                for (let i = 0; i < ambientCount; i++) {
                    particles.push(new Ember());
                }
            }

            function spawnBurst(x, y, count = 24) {
                for (let i = 0; i < count; i++) {
                    particles.push(new Ember(x, y, true));
                }
            }

            let lastMove = 0;
            function handlePointerMove(x, y) {
                const now = performance.now();
                if (now - lastMove > 35) {
                    particles.push(new Ember(x, y, true));
                    lastMove = now;
                }
            }

            window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches[0]) {
                    handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('click', (e) => {
                spawnBurst(e.clientX, e.clientY, 18);
            });

            window.addEventListener('resize', () => {
                resizeCanvas();
            });

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    if (p.burst && p.life <= 0) {
                        particles.splice(i, 1);
                    } else {
                        p.draw();
                    }
                }
                requestAnimationFrame(animate);
            }

            window.onload = function () {
                resizeCanvas();
                initParticles();
                animate();
            };
        })();
    </script>
</body>
</html>
